  <body>
    <div id="root"></div>
  <script>
(function () {
  function go(path) {
    if (window.top) window.top.location.href = path;
    else window.location.href = path;
  }
  document.addEventListener('click', function (event) {
    var target = event.target && event.target.closest && event.target.closest('a,button');
    if (!target) return;
    var id = (target.id || '').toLowerCase();
    var text = (target.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
    if (id === 'nav-signin' || text === 'sign in') {
      event.preventDefault();
      go('/login');
      return;
    }
    if (
      id === 'nav-cta' ||
      id === 'hero-primary-cta' ||
      id === 'final-cta-button' ||
      text.indexOf('start free') !== -1 ||
      text.indexOf('free trial') !== -1 ||
      text.indexOf('try voice spark') !== -1
    ) {
      event.preventDefault();
      go('/register');
    }
  }, true);
})();
</script><script>
(() => {
  const removeHeroChrome = () => {
    const headings = Array.from(document.querySelectorAll('h1'));
    const heroTitle = headings.find((item) => (item.textContent || '').includes('AI Content Marketing'));
    let heroRoot = null;
    if (heroTitle) {
      let node = heroTitle.parentElement;
      let depth = 0;
      while (node && node !== document.body && depth < 8) {
        const rect = node.getBoundingClientRect();
        const radius = window.getComputedStyle(node).borderRadius;
        if (rect.width > 900 && rect.height > 360 && radius !== '0px') {
          heroRoot = node;
          node.style.border = 'none';
          node.style.background = 'transparent';
          node.style.backdropFilter = 'none';
          node.style.webkitBackdropFilter = 'none';
          node.style.boxShadow = 'none';
          node.style.outline = 'none';
          break;
        }
        node = node.parentElement;
        depth += 1;
      }
      if (!heroRoot) {
        heroRoot = heroTitle.closest('section, main > div, [class*="hero"]');
      }
      if (heroRoot) {
        heroRoot.dataset.lenisPrevent = 'true';
      }
    }

    Array.from(document.querySelectorAll('header, nav, [class*="sticky"], [class*="fixed"]')).forEach((node) => {
      const rect = node.getBoundingClientRect();
      if (rect.top <= 4 && rect.width > window.innerWidth * 0.6) {
        node.style.borderBottom = 'none';
        node.style.boxShadow = 'none';
        node.style.outline = 'none';
      }
    });
  };

  const markNativeScrollSections = () => {
    Array.from(document.querySelectorAll('h1, h2')).forEach((heading) => {
      const text = heading.textContent || '';
      if (!text.includes('AI Content Marketing') && !text.includes('Start Creating Content')) return;
      const section = heading.closest('section, main > div, [class*="hero"]');
      if (section) section.dataset.lenisPrevent = 'true';
    });
  };

  const replaceDashboardPreview = () => {
    removeHeroChrome();
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if ((node.nodeValue || '').trim() !== 'Posts Generated') continue;
      let target = node.parentElement;
      while (target && target !== document.body) {
        const rect = target.getBoundingClientRect();
        const text = target.textContent || '';
        if (rect.width > 520 && rect.height > 260 && text.includes('Best Performing') && text.includes('Next Scheduled')) {
          if (target.dataset.dashboardImageApplied === 'true') return;
          target.dataset.dashboardImageApplied = 'true';
          target.innerHTML = '';
          const img = document.createElement('img');
          img.src = '/Dashboard.png';
          img.alt = 'Dashboard preview';
          img.loading = 'eager';
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'contain';
          img.style.objectPosition = 'center';
          img.style.display = 'block';
          img.style.borderRadius = '16px';
          target.appendChild(img);
          target.style.overflow = 'hidden';
          target.style.background = '#f7f5ff';
          target.style.padding = '10px';
          target.style.borderRadius = '20px';
          target.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.08)';
          let frame = target.parentElement;
          let depth = 0;
          while (frame && frame !== document.body && depth < 3) {
            frame.style.borderWidth = '1px';
            frame.style.borderColor = 'rgba(255,255,255,0.18)';
            frame.style.background = depth === 0 ? 'rgba(18,18,28,0.92)' : 'rgba(255,255,255,0.035)';
            frame.style.padding = depth === 0 ? '14px' : '16px';
            frame.style.borderRadius = depth === 0 ? '26px' : '32px';
            frame.style.boxShadow = depth === 1 ? '0 28px 70px rgba(0,0,0,0.34)' : frame.style.boxShadow;
            frame = frame.parentElement;
            depth += 1;
          }
          return;
        }
        target = target.parentElement;
      }
    }
  };

  const enableLenisScroll = async () => {
    if (window.__voiceSparkLenis || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const { default: Lenis } = await import('https://esm.sh/lenis@1.3.15');
    const lenis = new Lenis({
      duration: 1.5,
      easing: (t) => 1 - Math.pow(1 - t, 5),
      orientation: 'vertical',
      smoothWheel: true,
      wheelMultiplier: 1.2,
      touchMultiplier: 2,
      allowNestedScroll: true,
      prevent: (node) => Boolean(node.closest('iframe, [data-lenis-prevent], [data-chatbot], #chatbot, .chatbot, [id*="chatbot"], [class*="chatbot"]')),
    });
    window.__voiceSparkLenis = lenis;
    const raf = (time) => {
      lenis.raf(time);
      requestAnimationFrame(raf);
    };
    requestAnimationFrame(raf);
  };

  removeHeroChrome();
  markNativeScrollSections();
  replaceDashboardPreview();
  enableLenisScroll();
  window.addEventListener('load', replaceDashboardPreview);
  window.addEventListener('scroll', removeHeroChrome, { passive: true });
  setTimeout(replaceDashboardPreview, 250);
  setTimeout(replaceDashboardPreview, 900);
  setTimeout(removeHeroChrome, 1400);
  setTimeout(markNativeScrollSections, 1400);
})();
</script><script>
(function () {
  function openLegalPage(path) {
    if (window.top && window.top !== window) {
      window.top.location.href = path;
      return;
    }
    window.location.href = path;
  }

  document.addEventListener('click', function (event) {
    var link = event.target && event.target.closest && event.target.closest('a');
    if (!link) return;
    var label = (link.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
    if (label === 'privacy policy') {
      event.preventDefault();
      openLegalPage('/privacy-policy');
    }
    if (label === 'terms of service' || label === 'terms and conditions') {
      event.preventDefault();
      openLegalPage('/terms-and-conditions');
    }
  }, true);
})();
</script></body>
