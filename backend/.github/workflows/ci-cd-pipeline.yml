name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on push to dev branch
  pull_request:
    branches:
      - main  # Trigger on pull request to dev branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # Checkout the code

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'  # Your Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Install dependencies

    - name: Run tests
      run: |
        python manage.py test  # Run Django tests

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Runs only if the build job is successful

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # Checkout the repo again for deployment

    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.5.3  # Set up SSH agent with private key
      with:
        ssh-private-key: ${{ secrets.CICD_SSH_PRIVATE_KEY }}

    - name: Deploy application via SSH to 77.42.25.158
      run: |
        ssh -o StrictHostKeyChecking=no blaze@77.42.25.158 '
          cd /home/blaze/Blaze/BlazeBackend && \
          git stash && \
          git pull origin main && \
          source /home/blaze/Blaze/BlazeBackend/venv/bin/activate && \
          pip install -r requirements.txt && \
          echo "${{ secrets.CICD_SYS_PASS }}" | sudo -S systemctl daemon-reload && \

          celery -A blaze worker --loglevel=info -Q make_posts --autoscale=1,1 -n celery_server --detach --logfile=/home/blaze/Blaze/celery_server.log --pidfile=/home/blaze/Blaze/celery_server.pid


        '
